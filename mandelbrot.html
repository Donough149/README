<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mandelbrot Journey</title>
<meta name="theme-color" content="#101216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #101216; --panel: #181b21cc; --edge: #2a2f39;
    --text: #e8eaed; --dim: #9aa3af; --accent: #4fc3f7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  #julia { position: fixed; right: 12px; bottom: 12px; width: 180px; height: 180px; border: 1px solid var(--edge);
    border-radius: 10px; background: #000; pointer-events: none; display: none; }
  #bar { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 10px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #bar h1 { font-size: 15px; margin: 0 8px 0 0; white-space: nowrap; }
  #bar h1 span { color: var(--accent); }
  #bar button, #bar select { background: #1e222a; color: var(--text); border: 1px solid var(--edge); border-radius: 6px;
    padding: 5px 10px; font: inherit; cursor: pointer; }
  #bar button.on { color: var(--accent); border-color: var(--accent); }
  #info { color: var(--dim); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  #verse { position: fixed; left: 0; right: 0; bottom: 22px; text-align: center; color: var(--text); opacity: 0;
    font-style: italic; font-size: 15px; text-shadow: 0 1px 6px #000; transition: opacity 1.2s; pointer-events: none; padding: 0 16px; }
  @media (max-width: 600px) { #info { width: 100%; margin-left: 0; } #julia { width: 120px; height: 120px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="julia" width="180" height="180"></canvas>
<div id="bar">
  <h1>Mandelbrot <span>Journey</span></h1>
  <select id="place" aria-label="Destination">
    <option value="">Travel to…</option>
  </select>
  <button id="dive" title="Drift ever deeper toward the chosen destination">Dive</button>
  <button id="pal" title="Change palette">Palette</button>
  <button id="flow" title="Let the colors flow">Flow</button>
  <button id="jul" title="Show the Julia set of the point under the cursor">Julia</button>
  <button id="home" title="Back to the whole set">Home</button>
  <span id="info"></span>
</div>
<div id="verse"></div>
<script>
// z → z² + c. A point c belongs to the set when that orbit, started at 0, never escapes.
// Rendering is progressive (coarse blocks first, then full detail) and time-sliced so the
// page stays responsive. Plain doubles cap the useful zoom at about 1e13.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const jc = document.getElementById('julia'), jctx = jc.getContext('2d');
const info = document.getElementById('info'), verse = document.getElementById('verse');
const MAX_ZOOM = 1e13;

const PLACES = [
  ['Seahorse Valley', -0.743643887037151, 0.131825904205330],
  ['Elephant Valley', 0.2925755, -0.0149977],
  ['Triple spiral', -0.0880, 0.6540],
  ['Mini-brot on the spike', -1.7685736562, 0.0017642],
  ['Dendrite (Misiurewicz)', -0.10109636384562, 0.95628651080914],
  ['Feigenbaum point', -1.401155189, 0],
];
const VERSES = [
  'The same shape returns at every scale.',
  'Each boundary point is a whole world.',
  'Simple rules, endless detail.',
  'Everything here is connected — the set is one piece.',
  'Look closer: there is always more.',
  'Act with care; small changes ripple outward.',
];

// Palettes: cosine gradients a + b·cos(2π(c·t + d)).
const PALETTES = [
  [[.5,.5,.5],[.5,.5,.5],[1,1,1],[0,.10,.20]],
  [[.5,.5,.5],[.5,.5,.5],[1,1,.5],[.80,.90,.30]],
  [[.5,.5,.5],[.5,.5,.5],[1,.7,.4],[0,.15,.20]],
  [[.8,.5,.4],[.2,.4,.2],[2,1,1],[0,.25,.25]],
];
let palIdx = 0, lut = new Uint8Array(1024 * 3), phase = 0;
function buildLut() {
  const [a, b, c, d] = PALETTES[palIdx];
  for (let i = 0; i < 1024; i++) {
    const t = i / 1024 + phase;
    for (let k = 0; k < 3; k++)
      lut[i*3+k] = 255 * Math.min(1, Math.max(0, a[k] + b[k] * Math.cos(6.283185 * (c[k] * t + d[k]))));
  }
}

let view = { x: -0.6, y: 0, zoom: 1 };   // zoom 1 shows ~3 units across the short side
let W = 0, H = 0, dpr = 1, img, mu, gen = 0, busy = false;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = Math.round(innerWidth * dpr);
  H = cv.height = Math.round(innerHeight * dpr);
  img = ctx.createImageData(W, H);
  mu = new Float32Array(W * H);
  render();
}
const scale = () => 3 / (Math.min(W, H) * view.zoom);   // complex units per device pixel
const maxIter = () => Math.min(20000, Math.round(200 + 120 * Math.log2(1 + view.zoom)));

// Smooth (continuous) escape count; -1 means inside.
function escape(cx, cy, n) {
  // Skip the main cardioid and period-2 bulb outright.
  const q = (cx - .25) * (cx - .25) + cy * cy;
  if (q * (q + (cx - .25)) <= .25 * cy * cy || (cx + 1) * (cx + 1) + cy * cy <= .0625) return -1;
  let x = 0, y = 0, x2 = 0, y2 = 0, i = 0;
  while (i < n && x2 + y2 <= 256) { y = 2 * x * y + cy; x = x2 - y2 + cx; x2 = x * x; y2 = y * y; i++; }
  if (i >= n) return -1;
  return i + 1 - Math.log2(Math.log(x2 + y2) / 2 / Math.LN2);
}

function paint(i, m) {
  const p = i * 4, d = img.data;
  if (m < 0) { d[p] = d[p+1] = d[p+2] = 0; }
  else {
    const j = (Math.floor(Math.sqrt(m) * 64) & 1023) * 3;
    d[p] = lut[j]; d[p+1] = lut[j+1]; d[p+2] = lut[j+2];
  }
  d[p+3] = 255;
}

function render(passes = [8, 1]) {
  const my = ++gen, s = scale(), n = maxIter();
  const x0 = view.x - W / 2 * s, y0 = view.y - H / 2 * s;
  busy = true;
  let pass = 0, row = 0;
  info.textContent = `zoom ${view.zoom.toExponential(2)} · iterations ${n} · c = ${view.x.toFixed(12)} ${view.y < 0 ? '−' : '+'} ${Math.abs(view.y).toFixed(12)}i`;
  (function work() {
    if (my !== gen) return;
    const t0 = performance.now();
    while (performance.now() - t0 < 12) {
      const b = passes[pass];
      if (row >= H) { if (++pass >= passes.length) { ctx.putImageData(img, 0, 0); busy = false; return; } row = 0; continue; }
      const cy = y0 + row * s;
      for (let col = 0; col < W; col += b) {
        const m = escape(x0 + col * s, cy, n);
        if (b === 1) { mu[row * W + col] = m; paint(row * W + col, m); continue; }
        for (let yy = row; yy < Math.min(row + b, H); yy++)
          for (let xx = col; xx < Math.min(col + b, W); xx++) { mu[yy * W + xx] = m; paint(yy * W + xx, m); }
      }
      row += b;
    }
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(work);
  })();
}

// Re-tint the finished image without recomputing orbits.
function recolor() { for (let i = 0; i < mu.length; i++) paint(i, mu[i]); ctx.putImageData(img, 0, 0); }

function zoomAt(px, py, f) {
  const s = scale(), cx = view.x + (px - W / 2) * s, cy = view.y + (py - H / 2) * s;
  view.zoom = Math.min(MAX_ZOOM, Math.max(.3, view.zoom * f));
  const s2 = scale();
  view.x = cx - (px - W / 2) * s2; view.y = cy - (py - H / 2) * s2;
  render();
}
function toComplex(e) { const s = scale(); return [view.x + (e.clientX * dpr - W / 2) * s, view.y + (e.clientY * dpr - H / 2) * s]; }

// Julia set J(c): every point of the Mandelbrot set is the "address" of a connected Julia set.
let showJulia = false;
function drawJulia(cx, cy) {
  const N = jc.width, im = jctx.createImageData(N, N), d = im.data, s = 3.2 / N;
  for (let py = 0; py < N; py++) for (let px = 0; px < N; px++) {
    let x = (px - N / 2) * s, y = (py - N / 2) * s, i = 0;
    while (i < 120 && x * x + y * y < 16) { const t = x * x - y * y + cx; y = 2 * x * y + cy; x = t; i++; }
    const p = (py * N + px) * 4;
    if (i < 120) { const j = ((i * 9) & 1023) * 3; d[p] = lut[j]; d[p+1] = lut[j+1]; d[p+2] = lut[j+2]; }
    d[p+3] = 255;
  }
  jctx.putImageData(im, 0, 0);
}

// Pointer input: drag to pan, wheel / pinch / double-tap to zoom.
const pts = new Map(); let pinch0 = 0, lastTap = 0;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); stopDive();
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); }
  const now = Date.now();
  if (pts.size === 1 && now - lastTap < 300) zoomAt(e.clientX * dpr, e.clientY * dpr, e.shiftKey ? .25 : 4);
  lastTap = now;
});
cv.addEventListener('pointermove', e => {
  if (showJulia && e.pointerType === 'mouse') drawJulia(...toComplex(e));
  const prev = pts.get(e.pointerId); if (!prev) return;
  if (pts.size === 1) {
    const s = scale();
    view.x -= (e.clientX - prev[0]) * dpr * s; view.y -= (e.clientY - prev[1]) * dpr * s;
    pts.set(e.pointerId, [e.clientX, e.clientY]); render();
  } else if (pts.size === 2) {
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch0) zoomAt((a[0] + b[0]) / 2 * dpr, (a[1] + b[1]) / 2 * dpr, d / pinch0);
    pinch0 = d;
  }
});
const lift = e => { pts.delete(e.pointerId); pinch0 = 0; };
cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);
cv.addEventListener('wheel', e => { e.preventDefault(); stopDive(); zoomAt(e.clientX * dpr, e.clientY * dpr, Math.exp(-e.deltaY * .002)); }, { passive: false });

// Dive: glide toward a destination, zooming steadily until doubles run out.
let diving = null;
function stopDive() { if (!diving) return; diving = null; document.getElementById('dive').classList.remove('on'); render(); }
function dive() {
  if (diving) return stopDive();
  const opt = document.getElementById('place').value || 0, [, tx, ty] = PLACES[+opt];
  diving = { tx, ty }; document.getElementById('dive').classList.add('on');
  let last = performance.now(), verseAt = 0;
  (function step(now) {
    if (!diving) return;
    if (busy) return requestAnimationFrame(step);   // let the previous frame finish first
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    view.x += (diving.tx - view.x) * Math.min(1, dt * 2); view.y += (diving.ty - view.y) * Math.min(1, dt * 2);
    view.zoom *= Math.exp(dt * .7);
    if (view.zoom >= MAX_ZOOM) { view.zoom = MAX_ZOOM; stopDive(); say('The edge of what doubles can see — and still it continues.'); }
    if (now - verseAt > 9000) { verseAt = now; say(VERSES[Math.floor(Math.random() * VERSES.length)]); }
    if (diving) render([3]);
    requestAnimationFrame(step);
  })(last);
}
let verseTimer;
function say(t) { verse.textContent = t; verse.style.opacity = 1; clearTimeout(verseTimer); verseTimer = setTimeout(() => verse.style.opacity = 0, 5000); }

// Controls.
const sel = document.getElementById('place');
PLACES.forEach(([name], i) => sel.add(new Option(name, i)));
sel.onchange = () => { if (sel.value === '') return; stopDive(); const [, x, y] = PLACES[+sel.value]; view = { x, y, zoom: 1 }; render(); };
document.getElementById('dive').onclick = dive;
document.getElementById('home').onclick = () => { stopDive(); view = { x: -0.6, y: 0, zoom: 1 }; render(); };
document.getElementById('pal').onclick = () => { palIdx = (palIdx + 1) % PALETTES.length; buildLut(); recolor(); };
let flowing = false;
document.getElementById('flow').onclick = e => {
  flowing = !flowing; e.target.classList.toggle('on', flowing);
  (function tick() { if (!flowing) return; phase = (phase + .004) % 1; buildLut(); if (!diving) recolor(); requestAnimationFrame(tick); })();
};
document.getElementById('jul').onclick = e => {
  showJulia = !showJulia; e.target.classList.toggle('on', showJulia);
  jc.style.display = showJulia ? 'block' : 'none';
  if (showJulia) { drawJulia(view.x, view.y); say('Hover anywhere: each point of the set names a connected Julia set.'); }
};
addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=') zoomAt(W / 2, H / 2, 2);
  else if (e.key === '-') zoomAt(W / 2, H / 2, .5);
  else if (e.key === ' ') { e.preventDefault(); dive(); }
});
addEventListener('resize', resize);

buildLut(); resize();
say('Drag to wander, scroll or pinch to zoom, double-tap to dive in.');
</script>
</body>
</html>
