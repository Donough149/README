<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Airtime</title>
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0e1013; --card: #1b1f26; --edge: #2b313b;
    --text: #eceff3; --dim: #98a1ad; --accent: #4fc3f7; --live: #4ade80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, system-ui, sans-serif;
    padding: env(safe-area-inset-top) 0 0;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header { padding: 16px 18px 6px; }
  header h1 { margin: 0; font-size: 24px; letter-spacing: -0.3px; }
  header h1 span { color: var(--accent); }
  main { flex: 1; padding: 10px 14px 150px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .st {
    background: var(--card); border: 1px solid var(--edge); border-radius: 14px;
    padding: 14px; text-align: left; color: var(--text); font: inherit;
    min-height: 88px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .st:active { background: #232830; }
  .st.on { border-color: var(--accent); }
  .st .n { font-weight: 600; font-size: 16px; }
  .st .d { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .st .x { color: var(--dim); font-size: 12px; margin-top: 8px; }
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase;
       letter-spacing: 0.6px; margin: 22px 4px 10px; font-weight: 600; }
  form { display: flex; flex-direction: column; gap: 8px; }
  input {
    background: var(--card); border: 1px solid var(--edge); color: var(--text);
    border-radius: 12px; padding: 13px 14px; font: inherit; width: 100%;
  }
  input::placeholder { color: #6b7683; }
  form button {
    background: var(--accent); color: #062534; border: none; border-radius: 12px;
    padding: 13px; font: inherit; font-weight: 700;
  }
  #player {
    position: fixed; left: 0; right: 0; bottom: 0; background: #161a20;
    border-top: 1px solid var(--edge); display: flex; align-items: center; gap: 12px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  #art { width: 52px; height: 52px; border-radius: 10px; object-fit: cover;
         background: var(--card); flex: none; }
  #art:not([src]) { visibility: hidden; }
  #meta { flex: 1; min-width: 0; }
  #name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub { color: var(--dim); font-size: 13px; white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; }
  #sub.live::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--live); margin-right: 6px; vertical-align: middle;
  }
  #toggle {
    width: 58px; height: 58px; border-radius: 50%; border: none; flex: none;
    background: var(--accent); color: #062534; font-size: 23px;
  }
  #toggle:disabled { background: var(--card); color: var(--dim); }
</style>
</head>
<body>
<header><h1>Air<span>time</span></h1></header>
<main>
  <div class="grid" id="grid"></div>

  <h2>Add a station</h2>
  <form id="add">
    <input id="sName" placeholder="Name (e.g. Amarillo)" autocapitalize="words">
    <input id="sUrl" placeholder="Stream address (https://...)" type="url"
           autocapitalize="none" autocorrect="off" spellcheck="false">
    <button type="submit">Save to this phone</button>
  </form>
</main>

<div id="player">
  <audio id="audio" preload="none"></audio>
  <img id="art" alt="">
  <div id="meta">
    <div id="name">Nothing playing</div>
    <div id="sub">Pick a station</div>
  </div>
  <button id="toggle" disabled>▶</button>
</div>

<script>
"use strict";

// Built-in stations. Custom ones live in localStorage and are added via the form.
const BUILT_IN = [
  { name: "Groove Salad",   desc: "ambient / downtempo", url: "https://ice1.somafm.com/groovesalad-128-mp3", art: "https://somafm.com/img3/groovesalad-400.jpg" },
  { name: "Drone Zone",     desc: "atmospheric",         url: "https://ice1.somafm.com/dronezone-128-mp3",   art: "https://somafm.com/img3/dronezone-400.jpg" },
  { name: "Secret Agent",   desc: "spy jazz / lounge",   url: "https://ice1.somafm.com/secretagent-128-mp3", art: "https://somafm.com/img3/secretagent-400.jpg" },
  { name: "Indie Pop Rocks", desc: "indie",              url: "https://ice1.somafm.com/indiepop-128-mp3",    art: "https://somafm.com/img3/indiepop-400.jpg" },
  { name: "Lush",           desc: "vocal / dreamy",      url: "https://ice1.somafm.com/lush-128-mp3",        art: "https://somafm.com/img3/lush-400.jpg" },
  { name: "Beat Blender",   desc: "deep house",          url: "https://ice1.somafm.com/beatblender-128-mp3", art: "https://somafm.com/img3/beatblender-400.jpg" },
];

const $ = (id) => document.getElementById(id);
const audio = $("audio");

const store = {
  read(key, fallback) {
    try { return JSON.parse(localStorage.getItem("airtime." + key)) ?? fallback; }
    catch { return fallback; }
  },
  write(key, value) {
    try { localStorage.setItem("airtime." + key, JSON.stringify(value)); } catch {}
  },
};

let custom = store.read("stations", []);
let current = null;

const stations = () => custom.concat(BUILT_IN);

function render() {
  const grid = $("grid");
  grid.textContent = "";
  stations().forEach((s) => {
    const b = document.createElement("button");
    b.className = "st" + (current && current.url === s.url ? " on" : "");
    b.onclick = () => play(s);

    const n = document.createElement("div");
    n.className = "n";
    n.textContent = s.name;

    const d = document.createElement("div");
    d.className = "d";
    d.textContent = s.desc || "";
    b.append(n, d);

    if (s.custom) {
      const x = document.createElement("div");
      x.className = "x";
      x.textContent = "Remove";
      x.onclick = (e) => { e.stopPropagation(); remove(s); };
      b.appendChild(x);
    }
    grid.appendChild(b);
  });
}

function remove(s) {
  custom = custom.filter((c) => c.url !== s.url);
  store.write("stations", custom);
  render();
}

function play(s) {
  current = s;
  audio.src = s.url;
  audio.play().catch(() => setSub("Couldn't connect — tap ▶ to retry"));

  $("name").textContent = s.name;
  setSub(s.desc || "Live", true);
  const art = $("art");
  if (s.art) { art.src = s.art; art.onerror = () => art.removeAttribute("src"); }
  else art.removeAttribute("src");

  $("toggle").disabled = false;
  store.write("last", s);
  render();

  // Station-level info only: this is the station's name and logo, not the
  // current song. Reading track titles needs the stream itself, which a web
  // page can't see.
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.name,
      artist: s.desc || "Live radio",
      artwork: s.art ? [{ src: s.art, sizes: "400x400" }] : [],
    });
    navigator.mediaSession.setActionHandler("play", toggle);
    navigator.mediaSession.setActionHandler("pause", toggle);
  }
}

function setSub(text, live) {
  const sub = $("sub");
  sub.textContent = text;
  sub.className = live ? "live" : "";
}

function toggle() {
  if (!current) return;
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
}

$("toggle").onclick = toggle;
audio.onplaying = () => { $("toggle").textContent = "⏸"; setSub(current.desc || "Live", true); };
audio.onpause = () => { $("toggle").textContent = "▶"; setSub("Paused"); };
audio.onwaiting = () => setSub("Buffering…");
audio.onerror = () => setSub("Stream unavailable");

$("add").onsubmit = (e) => {
  e.preventDefault();
  const name = $("sName").value.trim();
  const url = $("sUrl").value.trim();
  if (!name || !url) return;
  custom.unshift({ name, url, desc: "Added by you", custom: true });
  store.write("stations", custom);
  $("sName").value = $("sUrl").value = "";
  render();
};

// Restore the last station without autoplaying — iOS blocks that anyway.
const last = store.read("last", null);
if (last) {
  current = last;
  $("name").textContent = last.name;
  setSub("Tap ▶ to resume");
  if (last.art) $("art").src = last.art;
  $("toggle").disabled = false;
}
render();
</script>
</body>
</html>
